# Licence policy for the notices shipped with each release (scripts/notices.sh, ADR-013).
# `accepted` is the allow-list: cargo-about fails if a dependency offers no licence on it.
# Anything copyleft-only (GPL, LGPL, AGPL) is deliberately absent. The crates that list one
# of those only as an "OR" option are accepted through their permissive alternative.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Dependencies only the tests use are not shipped.
ignore-dev-dependencies = true
# Only what the release bundles are built for.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
