[package]
name = "mdbrowser"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A browser for the web of Markdown — no HTML, no DOM, no webview"

# How the app is packaged (ADR-009). The release workflow builds with `cargo build --release` and
# `scripts/notices.sh` first, then runs `cargo packager --release` with the formats for its platform.
# The packager's own file associations are deliberately unused: it claims the default Markdown app on Windows and adds
# document types on macOS. "Open with" comes from the two templates below instead.
[package.metadata.packager]
product-name = "mdBrowser"
identifier = "com.gbrettmiller.mdbrowser"
description = "A browser for the web of Markdown"
long-description = "mdBrowser reads Markdown on the web and on disk with its own layout engine: no HTML, no DOM, no webview."
homepage = "https://github.com/gbrettmiller/mdbrowser-native"
authors = ["gBRETT miller"]
category = "Utility"
license-file = "LICENSE"
out-dir = "target/packager"
binaries-dir = "target/release"
binaries = [{ path = "mdbrowser", main = true }]
# Every bundle ships the licence notices (ADR-013's release gate).
resources = ["THIRD-PARTY-NOTICES.html", "LICENSE", "LICENSE-APACHE", "LICENSE-MIT"]
icons = [
  "assets/icon/icon-32.png",
  "assets/icon/icon-128.png",
  "assets/icon/icon-256.png",
  "assets/icon/icon-512.png",
  "assets/icon/icon.ico",
  "assets/icon/icon.icns",
]

[package.metadata.packager.deb]
desktop-template = "packaging/linux/mdbrowser.desktop"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
template = "packaging/windows/installer.nsi"

[dependencies]
dirs = "7.0.0"
# Only the codecs ADR-004 allows: no AVIF, TIFF, EXR or the rest.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
iced = { version = "0.14", features = ["canvas", "advanced", "image-without-codecs"] }
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
pulldown-cmark = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.0"
url = "2.5.8"
yaml-rust2 = "0.13.0"

[dev-dependencies]
cucumber = "0.23.0"
flate2 = "1.1.10"
futures = "0.3.34"
insta = "1.49.0"
tempfile = "3.27.0"

# Shaping and rendering crates are unusably slow unoptimised; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
harness = false

[target."cfg(unix)".dependencies]
libc = "0.2.191"
